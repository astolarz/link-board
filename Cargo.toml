[package]
name = "link-board"
version = "0.1.0"
edition = "2024"
authors = ["Aaron Stolarz <aaronstolarz@gmail.com>"]
license = "MIT OR Apache-2.0"
resolver = "2"
rust-version = "1.92"

[[bin]]
name = "cli"
required-features = ["cli"]

[[bin]]
name = "esp32"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors
required-features = ["esp32"]

[features]
default = []
cli = ["openssl", "reqwest", "simple_logger", "tokio/signal"]
esp32 = ["anyhow", "embedded-svc", "esp-idf-hal", "esp-idf-svc", "smart-leds", "smol", "ws2812-spi", "piper"]
rpi = ["ws2818-rgb-led-spi-driver"]

[dependencies]
cfg-if = "1"
colored = "3"
dotenvy_macro = { version = "0.15.7" }
futures = "0.3.31"
log = { version = "0.4.22", features = ["max_level_debug", "release_max_level_info"] }
phf = { version = "0.13", features = ["macros"] }
priority-queue = "2.1.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.128" }
toml-cfg = "0.2.0"

# cli deps:
openssl = { version = "0.10", features = ["vendored"], optional = true }
reqwest = { version = "0.13", optional = true }
simple_logger = { version = "5", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

# esp32 deps:
anyhow = { version = "1", optional = true }
embedded-svc = { version = "0.29.0", optional = true }
esp-idf-hal = { version = "0.46.2", optional = true }
esp-idf-svc = { version = "0.52", features = ["critical-section", "embassy-sync"], optional = true }
smart-leds = { version = "0.4.0", optional = true }
smol = { version = "2.0.2", optional = true }
ws2812-spi = { version = "0.5.0", features = ["mosi_idle_high"], optional = true }
# latest piper (0.2.5) fails to compile for debug and release. 0.2.4 compiles for debug, but not release.
piper = { version = "=0.2.4", optional = true }

# rpi deps:
ws2818-rgb-led-spi-driver = { version = "2.0.0", optional = true }

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"